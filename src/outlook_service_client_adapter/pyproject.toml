[project]
name = "outlook-service-client-adapter"
version = "0.1.0"
description = "Adapter that implements the Client ABC by delegating to the auto-generated service client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "calendar-client-api",
    "outlook-client-service-api-client",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_service_client_adapter"]

[tool.hatch.build.targets.wheel.force-include]
"src/outlook_service_client_adapter/py.typed" = "outlook_service_client_adapter/py.typed"

[tool.uv.sources]
calendar-client-api = { workspace = true }
outlook-client-service-api-client = { workspace = true }
