[project]
name = "intelligent-app-service"
version = "0.1.0"
description = "Intelligent application service orchestrating calendar, issue tracker, and AI clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ai-client-api",
    "calendar-client-api",
    "issue-tracker-client-adapter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligent_app_service"]

[tool.hatch.build.targets.wheel.force-include]
"src/intelligent_app_service/py.typed" = "intelligent_app_service/py.typed"

[tool.uv.sources]
ai-client-api = { workspace = true }
calendar-client-api = { workspace = true }
issue-tracker-client-adapter = { workspace = true }