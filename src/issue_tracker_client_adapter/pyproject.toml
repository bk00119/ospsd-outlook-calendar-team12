[project]
name = "issue-tracker-client-adapter"
version = "0.1.0"
description = "Adapter layer for integrating the shared issue tracker API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_tracker_client_adapter"]

[tool.hatch.build.targets.wheel.force-include]
"src/issue_tracker_client_adapter/py.typed" = "issue_tracker_client_adapter/py.typed"
