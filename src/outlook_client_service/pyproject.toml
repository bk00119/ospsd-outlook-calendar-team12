[project]
name = "outlook-client-service"
version = "0.1.0"
description = "A FastAPI service for interacting with Outlook calendar APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv>=1.0.0",
    "pydantic",
    "itsdangerous",
    "calendar-client-api",
    "outlook-client-impl",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-requests>=0.48b0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_client_service"]

[tool.hatch.build.targets.wheel.force-include]
"src/outlook_client_service/py.typed" = "outlook_client_service/py.typed"

[tool.uv.sources]
calendar-client-api = { workspace = true }
outlook-client-impl = { workspace = true }