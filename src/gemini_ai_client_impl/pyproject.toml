[project]
name = "gemini-ai-client-impl"
version = "0.1.0"
description = "Gemini implementation of the shared AI client API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ai-client-api",
    "google-genai",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_ai_client_impl"]

[tool.hatch.build.targets.wheel.force-include]
"src/gemini_ai_client_impl/py.typed" = "gemini_ai_client_impl/py.typed"

[tool.uv.sources]
ai-client-api = { workspace = true }
