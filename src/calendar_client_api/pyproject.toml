[project]
name = "calendar-client-api"
version = "0.1.0"
description = "A Python client library for interacting with calendar APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_client_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/calendar_client_api/py.typed" = "calendar_client_api/py.typed"
