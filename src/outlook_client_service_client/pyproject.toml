[project]
  name = "outlook-client-service-client"
  version = "0.1.0"
  description = "A client library for accessing Outlook Client Service"
  readme = "README.md"
  requires-python = ">=3.11"
  dependencies = [
      "httpx>=0.23.0,<0.29.0",
      "attrs>=22.2.0",
      "python-dateutil>=2.8.0,<3.0.0",
  ]

  [build-system]
  requires = ["hatchling"]
  build-backend = "hatchling.build"

  [tool.hatch.build.targets.wheel]
  packages = ["outlook_client_service_client"]

  [tool.hatch.build.targets.wheel.force-include]
  "outlook_client_service_client/py.typed" = "outlook_client_service_client/py.typed"