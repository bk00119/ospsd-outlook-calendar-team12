[project]
name = "team12-calendar-client-api"
version = "0.1.0"
description = "Repository for a calendar client API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.15",
    "mkdocstrings-python>=1.16.12",
    "mypy>=1.17.0",
    "openapi-python-client>=0.28.3",
    "pymdown-extensions>=10.16.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.7",
    "types-python-dateutil>=2.9.0.20250822",
    "types-requests>=2.32.4.20250611",
]

[tool.uv.workspace]
members = [
    "src/calendar_client_api",
    "src/outlook_client_impl",
    "src/outlook_client_service",
    "src/outlook_client_service_client",
    "src/outlook_service_client_adapter",
]

[tool.ruff]
line-length = 130 # high for top level due to tests
target-version = "py311"
extend-exclude = ["src/outlook_client_service_client"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", # `incorrect-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible. Ignoring `incorrect-blank-line-before-class`.
    "D213", # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible. Ignoring `multi-line-summary-second-line`.
    "D400",   # First line should end with a period
    "D415",   # First line should end with punctuation
    "TD002",  # Missing author in TODO
    "TD003",  # Missing issue link in TODO
    "FIX002", # Line contains TODO (don't flag TODOs as errors)
    "S101", # Use of `assert` detected --> Asserts are good in our opinion. Tests use asserts profusely.
    "T201",   # Print found (allow print statements)
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["TRY300", "BLE001", "ANN401", "SLF001", "E501", "S105", "ARG001", "ARG002", "S106", "INP001", "PLC0415"]
"tests/**" = ["INP001"]

[tool.mypy]
strict = true
explicit_package_bases = true # Required for src layout
exclude = "^src/outlook_client_service_client/"
mypy_path = [
    "src/calendar_client_api/src",
    "src/outlook_client_impl/src",
    "src/outlook_client_service/src",
    "src/outlook_service_client_adapter/src",
]
ignore_missing_imports = false

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "src/calendar_client_api/src",
    "src/outlook_client_impl/src",
    "src/outlook_client_service/src",
    "src/outlook_service_client_adapter/src",
]
testpaths = ["tests", "src/*/tests"]
addopts = ["--cov", "--cov-report=term-missing", "--import-mode=importlib"]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (medium speed, real dependencies)",
    "e2e: marks tests as end-to-end tests (slow, full system)",
    "circleci: marks tests that can run in CI/CD environments without local credentials",
    "local_credentials: marks tests that require local credentials.json or token.json files",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__main__.py", "src/outlook_client_service_client/*"]

[tool.coverage.report]
fail_under = 85 # Justification: A high threshold ensures most code is tested.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
